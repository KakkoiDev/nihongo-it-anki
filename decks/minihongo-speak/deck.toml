[deck]
slug = "minihongo-speak"
name = "minihongo 話す / Minihongo Production"
model_id = 2112897839
# Registered in jpanki's ids.toml as `minihongo-speak`, reserving
# 2666006716 + 1..200.
deck_base_id = 2666006716

# The fourth card type. Front is the English and the situation, back is the
# sentence, its audio, its pitch accent and the real Japanese beside the
# minihongo construction. Only this deck opts in; the others keep the three
# cards, nine fields and stylesheet they have always shipped.
production_card = true

# No sentence here is currently in another deck, but they are short, built from
# a 231-word core, and regenerated from a repo this one does not control - the
# next minihongo release could easily mint one that collides. Without a
# namespace that import lands as a notetype conflict: deck present, zero cards,
# no error. See tests/test_import_into_anki.py.
guid_namespace = "minihongo-speak"

# Cloze is the whole paraphrase on a vocabulary row and a core word on a dialog
# row; both occur in Sentence, so the default check stays on.

[tiers]
count = 21

# One tier per minihongo can-do goal, the six work can-dos first. Each tier
# opens with the dialog lines for that can-do and continues with the vocabulary
# those lines are built from - see decks/minihongo-speak/REFERENCE.md.
[tiers.names]
1 = "Tier 1 - 朝会で進捗を共有できる / I can give a standup update"
2 = "Tier 2 - 障害を報告できる / I can report an incident"
3 = "Tier 3 - システムの仕組みを説明できる / I can explain a system"
4 = "Tier 4 - 技術デモができる / I can run a technical demo"
5 = "Tier 5 - タスクを計画できる / I can plan a task"
6 = "Tier 6 - 要件を確認できる / I can clarify a requirement"
7 = "Tier 7 - 自己紹介ができる / I can introduce myself"
8 = "Tier 8 - 店で買い物ができる / I can buy things at a shop"
9 = "Tier 9 - レストランで注文できる / I can order at a restaurant"
10 = "Tier 10 - 道を尋ねられる / I can ask for directions"
11 = "Tier 11 - 切符を買って電車に乗れる / I can buy a ticket and take the train"
12 = "Tier 12 - 医者に痛みを伝えられる / I can describe pain to a doctor"
13 = "Tier 13 - 薬局で薬を買える / I can buy medicine at a pharmacy"
14 = "Tier 14 - 緊急時に助けを求められる / I can ask for help in an emergency"
15 = "Tier 15 - 電話で予約できる / I can make an appointment by phone"
16 = "Tier 16 - 市役所で住所を届け出られる / I can register my address at city hall"
17 = "Tier 17 - 聞き返すことができる / I can ask someone to repeat or slow down"
18 = "Tier 18 - 近所の人に挨拶できる / I can greet my neighbors"
19 = "Tier 19 - 天気の話ができる / I can make small talk about the weather"
20 = "Tier 20 - 円の値段が分かって言える / I can understand and say prices in yen"
21 = "Tier 21 - 時刻が言える / I can tell the time"

