[project]
name = "nihongo-it-anki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jpanki",
    "edge-tts>=6.1.0",
    "fugashi>=1.5.2",
    "genanki>=0.13.1",
    "jaconv>=0.4.1",
    "mojimoji>=0.0.13",
    "pyopenjtalk>=0.4.1",
    "soundfile>=0.13.1",
    "unidic-lite>=1.0.8",
]

[dependency-groups]
dev = [
    "anki>=25.9.4",
    "pytest>=9.0.2",
]

[tool.uv.sources]
# Pinned to a revision rather than tracking main: a library change can alter
# how cards render, and that should be a deliberate bump with a rebuild and a
# deck comparison, never something a fresh `uv sync` picks up silently.
jpanki = { git = "https://github.com/KakkoiDev/jpanki", rev = "fb583233d5bc414b0e2fe6d63f04154b9528606c" }
